# install.conf - mount settings for the log archive.
#
# install.sh creates /etc/logs/install.conf from this file on the first
# install and never overwrites it. Fill it in, then apply it with:
#
#     sudo logs-install --apply
#
# This file holds the SMB passwords. It must be owned by root with mode 0600;
# the installer fixes that if it is not. Never commit the real file anywhere.
#
# Format
#   KEY=value, one per line, no spaces around the "=".
#   A "#" starts a comment only at the beginning of a line, never after a
#   value, because passwords may contain "#".
#   Nothing is evaluated: "$", backticks, backslashes and quotes inside a
#   value are taken literally.
#   Unquoted values lose leading and trailing spaces. A value wrapped in one
#   pair of "double" or 'single' quotes loses those quotes and is otherwise
#   kept exactly. To keep spaces at the ends, or a password that itself starts
#   and ends with a quote character, add one extra pair of quotes.
#   A password may contain any character except a line break.
#   Unknown keys, duplicate keys and malformed lines stop the installer with a
#   message that names the line.

# The SMB share both mounts point to, as //server/share (for example
# //nas.example.com/logs). Leave it empty to set up no mounts at all.
LOGS_SMB_SHARE=

# Optional SMB domain or workgroup. Leave it empty if you do not use one.
LOGS_SMB_DOMAIN=

# SMB user with write access. The collector writes through this one. Leave it
# empty if this host does not run the collector.
LOGS_SMB_RW_USER=

# Password of that user.
LOGS_SMB_RW_PASSWORD=

# SMB user with read-only access. The web UI reads through this one. Leave it
# empty if the web UI is not installed on this host.
LOGS_SMB_RO_USER=

# Password of that user.
LOGS_SMB_RO_PASSWORD=

# Local user that owns the read-write mount, so that it can write to it.
# logs-collector is the user of the systemd timers. If Semaphore or another
# tool runs the playbooks, use its user (for example semaphore).
LOGS_RW_OWNER=logs-collector

# Where the read-write mount (collector) and the read-only mount (web UI) go.
# They must be absolute paths and must differ.
LOGS_RW_MOUNT=/mnt/logs-rw
LOGS_RO_MOUNT=/mnt/logs-ro
