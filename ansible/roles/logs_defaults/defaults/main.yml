---
# Defaults for every logs_* variable. Do not edit this file for your site:
# override the values in group_vars/all.yml (see group_vars/all.example.yml),
# in your inventory, or with extra vars (for example a Semaphore variable group).

# --- where the logs go -------------------------------------------------------
logs_root: /mnt/logs-rw
# The collector refuses to write when logs_root is not on one of these
# filesystem types (protects the system disk when the share is not mounted).
# Set to [] to allow any filesystem.
logs_root_fstypes: [cifs, smb3]

# --- what to collect ---------------------------------------------------------
logs_targets: all            # Ansible host pattern
logs_collect_localhost: false  # also collect the collector itself (connection: local)
logs_localhost_name: collector  # directory name used for the collector's own logs
# Use sudo for the collector's own logs. With false, the user that runs the
# playbook must be in the groups systemd-journal (and docker, if used).
logs_localhost_become: true
logs_day: ""                 # YYYY-MM-DD; empty means yesterday
logs_timezone: ""            # TZ name for the day window; empty means the collector's time zone
logs_force: false            # collect hosts again that already succeeded for this day

logs_journal: auto           # auto | yes | no   (auto: only where journalctl exists)
logs_journal_format: short-iso-precise  # any journalctl --output format, e.g. json or export
logs_docker: auto            # auto | yes | no   (auto: only where docker exists)
logs_extra_files: []         # extra log files (paths or globs); set per host
logs_extra_files_by_host: {}   # same, as a map of inventory hostname -> list (handy for extra vars)
logs_count_levels: true      # count lines that mention error / warning words

logs_remote_tmp: /var/tmp/logs-collect   # staging directory on the hosts
logs_remote_state_dir: /var/lib/logs-collect  # offsets of the extra files

# --- logs that arrive without Ansible ----------------------------------------
logs_push_hosts: []          # names of hosts that push with helpers/logs-push.sh; missing ones are reported
logs_syslog_spool: ""        # spool of the rsyslog_receiver role, e.g. /var/spool/logs-syslog
logs_syslog_names: {}        # sender IP -> name, e.g. {"192.0.2.1": "firewall"}
logs_syslog_keep_days: 7     # days to keep already imported spool files

# --- retention ---------------------------------------------------------------
logs_raw_days: 60            # keep this many days uncompressed
logs_archive_days: 0         # delete archives older than this many days; 0 = never
logs_archive_max_gb: 0       # delete the oldest archives above this total size; 0 = no cap
logs_zstd_level: 19
logs_zstd_window_log: 25     # zstd --long=<n>; see "Retention" in the README before raising it
logs_zstd_threads: 1

# --- notification ------------------------------------------------------------
logs_fail_on_host_failure: true  # end the run as failed when a host had problems
logs_notify_on_failure: false
logs_smtp_host: ""
logs_smtp_port: 587
logs_smtp_security: starttls  # starttls | tls | none
logs_smtp_user: ""
# The password is read from the environment variable LOGS_SMTP_PASSWORD
# (systemd: /etc/logs/collector.secrets.env, Semaphore: a secret environment
# variable). Never put it in a variable file.
logs_smtp_from: ""
logs_smtp_to: []
