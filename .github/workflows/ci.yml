name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  webui:
    name: Web UI (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: webui/go.mod
          cache-dependency-path: webui/go.sum
      - name: Format
        run: test -z "$(gofmt -l webui)"
      - name: Vet and test
        working-directory: webui
        run: |
          go vet ./...
          go test -race ./...
      - name: Build both architectures
        run: scripts/build-release.sh ci

  collector:
    name: Collector (Ansible)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ansible-core zstd shellcheck
      - name: Shell scripts
        run: shellcheck install.sh helpers/*.sh scripts/*.sh tests/*.sh .githooks/*
      - name: Python modules compile
        run: python3 -m py_compile ansible/library/*.py ansible/module_utils/*.py
      - name: Playbook syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check collect.yml retention.yml syslog-receiver.yml
      - name: End-to-end test with generated data
        run: tests/integration.sh

  hygiene:
    name: Secrets and public-repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No private addresses, site files or log files
        run: scripts/check-public.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
